# CI exists for ONE reason above all others: this installer has never run on
# Windows, and the first client install is on Windows. A green macOS run proves
# nothing about the platform that matters.
#
# The Windows job is not a nice-to-have here. Three of the defects found by
# review were Windows-specific (npm .cmd shims needing a shell since
# CVE-2024-27980, percent-encoded paths, PowerShell quoting), and every one was
# written from documentation rather than observation. This is the cheapest way
# to turn that inference into evidence.

name: ci

on:
  # Branch pushes keep their existing CI coverage. Version tags enter through
  # release.yml, which calls this same workflow and waits for every job before
  # it is allowed to create a draft release.
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_id:
        description: Immutable Actions artifact ID containing the tested raw package.
        value: ${{ jobs.package.outputs.artifact_id }}
      artifact_name:
        description: Exact raw package artifact tested by every matrix job.
        value: ${{ jobs.package.outputs.artifact_name }}
      package_sha256:
        description: Raw SHA-256 of the tested package bytes.
        value: ${{ jobs.package.outputs.package_sha256 }}

permissions:
  contents: read

jobs:
  # Build the package once. Every operating-system job below installs these
  # exact bytes, and the tag workflow publishes this same Actions artifact.
  # That closes the gap where six green jobs could each test a different pack
  # and release.yml could then build a seventh, never-tested tarball.
  package:
    name: build one exact package
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: install exact locked dependencies
        run: npm ci --ignore-scripts

      - name: reject private package inputs before upload
        run: node test/package-privacy.test.mjs --scan-only

      - name: pack once and bind the raw bytes
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          checkout_commit="$(git rev-parse 'HEAD^{commit}')"
          event_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [[ "$checkout_commit" != "$event_commit" ]]; then
            echo "::error::package checkout $checkout_commit does not match event $event_commit"
            exit 1
          fi

          package_dir="$RUNNER_TEMP/exact-package"
          mkdir -p "$package_dir"
          npm pack --json --ignore-scripts --pack-destination "$package_dir" \
            > "$package_dir/npm-pack.json"

          package_version="$(node -p "require('./package.json').version")"
          expected_name="brain-installer-$package_version.tgz"
          artifact_name="$(node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.length !== 1 || typeof report[0]?.filename !== "string") {
              throw new Error("npm pack did not report exactly one package");
            }
            process.stdout.write(report[0].filename);
          ' "$package_dir/npm-pack.json")"
          if [[ "$artifact_name" != "$expected_name" ]]; then
            echo "::error::npm packed $artifact_name, expected $expected_name"
            exit 1
          fi

          package_path="$package_dir/$artifact_name"
          package_sha256="$(node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));
          ' "$package_path")"
          if [[ ! "$package_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::package SHA-256 is malformed"
            exit 1
          fi

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "packed $artifact_name at sha256:$package_sha256"

      # v7 can store one file without a ZIP wrapper. The artifact digest is
      # therefore the package's digest, not the digest of a transport archive.
      - name: upload the raw package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.package_path }}
          archive: false
          if-no-files-found: error
          # A rerun creates a new immutable ID. Because raw uploads use the
          # file basename as their artifact name, this replaces only the prior
          # attempt's artifact with that same exact basename.
          overwrite: true
          retention-days: 7

      - name: verify the uploaded raw digest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          LOCAL_SHA256: ${{ steps.pack.outputs.package_sha256 }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::uploaded artifact ID is malformed"
            exit 1
          fi
          uploaded_sha256="${UPLOAD_DIGEST#sha256:}"
          if [[ "$uploaded_sha256" != "$LOCAL_SHA256" ]]; then
            echo "::error::uploaded artifact digest does not match the package bytes"
            exit 1
          fi

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the Windows job because macOS failed. Windows is the one we
      # are actually here to learn from.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      # Pin third-party actions to reviewed commits. A mutable major tag can
      # change underneath an otherwise identical installer release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # This job does not need shared dependency-cache state. Keeping the
          # cache off also removes a cache-poisoning input from release CI.
          package-manager-cache: false

      # v8 understands the raw, unarchived artifact emitted by upload-artifact
      # v7. Resolve the producer's immutable artifact ID, then independently hash
      # the downloaded .tgz before any install command can touch it.
      - name: download the one shared raw package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .release-package
          skip-decompress: true
          digest-mismatch: error

      - name: verify exact shared package bytes
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.package.outputs.package_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tgz=".release-package/$ARTIFACT_NAME"
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [path, expected] = process.argv.slice(1);
            if (!/^[0-9a-f]{64}$/.test(expected)) throw new Error("expected package SHA-256 is malformed");
            const actual = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            if (actual !== expected) throw new Error(`package SHA-256 ${actual} does not match ${expected}`);
          ' "$tgz" "$EXPECTED_SHA256"
          echo "TARBALL=$tgz" >> "$GITHUB_ENV"
          echo "verified $ARTIFACT_NAME at sha256:$EXPECTED_SHA256"

      # The operator runs preflight from the installed release, not from a
      # source checkout. Extract both scripts from the one shared artifact so
      # every matrix job proves those exact bytes were actually packaged.
      - name: extract preflight from exact package
        shell: bash
        run: |
          set -euo pipefail
          tarball="$TARBALL"
          if command -v cygpath >/dev/null 2>&1; then
            tarball=$(cygpath -u "$tarball")
          fi
          mkdir -p .packaged-preflight
          tar -xzf "$tarball" -C .packaged-preflight \
            package/tools/preflight.sh package/tools/preflight.ps1
          test -f .packaged-preflight/package/tools/preflight.sh
          test -f .packaged-preflight/package/tools/preflight.ps1
          echo "both packaged preflight scripts extracted from $(basename "$tarball")"

      # --ignore-scripts is what the client is told to run, so CI runs the same
      # thing. If a dependency needs a postinstall script, better to find out
      # here than on someone's laptop.
      - name: install
        run: npm ci --ignore-scripts

      # Fixed bytes only. This isolates the built-in C# compiler, private helper
      # staging, Windows profile, stdin framing, and DPAPI availability without
      # ever putting a credential in CI output.
      - name: Windows DPAPI stage probe
        if: runner.os == 'Windows'
        run: node test/fixtures/windows-dpapi-probe.mjs

      - name: unit and integration suite
        run: npm test

      # Keep incident regressions visible even when the long npm test chain
      # stops at an earlier failure. This is automated proof, not release clearance.
      - name: independent incident regressions
        if: ${{ !cancelled() }}
        run: npm run audit:regressions

      # A runner may legitimately have no Wrangler session or manifest, so the
      # exit may be diagnostic. Require the packaged script to parse, execute,
      # and print its identifying header.
      - name: packaged preflight runs and prints (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $path = Resolve-Path .\.packaged-preflight\package\tools\preflight.ps1
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File $path 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "preflight exit: $code"
          if ($out -notmatch 'Financial Brain preflight') { throw 'packaged preflight did not run' }
          $e=$null; $t=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$t, [ref]$e) | Out-Null
          if ($e.Count -gt 0) { $e | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "preflight.ps1 parsed clean"

      - name: packaged preflight runs and prints (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          out=$(bash .packaged-preflight/package/tools/preflight.sh 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          echo "preflight exit: $code"
          printf '%s\n' "$out" | grep -q 'Financial Brain preflight' || { echo "::error::packaged preflight did not run"; exit 1; }
          bash -n .packaged-preflight/package/tools/preflight.sh
          echo "preflight.sh parsed clean"

      # The CLI must START. On Windows a symlinked bin, a percent-encoded path
      # or a .cmd shim can make it exit 0 having done nothing, which is worse
      # than crashing because every exit-code check passes.
      - name: cli starts and prints usage
        shell: bash
        run: |
          out=$(node brain.mjs)
          echo "$out"
          echo "$out" | grep -Eq 'setup[[:space:]]+\[manifest\]' || { echo "::error::usage did not print"; exit 1; }

      # doctor must RUN and report, with no Cloudflare credentials present. It
      # is expected to report failures here; what is NOT acceptable is a crash,
      # because doctor is the tool whose whole job is diagnosing a bare machine.
      - name: doctor reports rather than crashing
        shell: bash
        run: |
          set +e
          out=$(node brain.mjs doctor 2>&1); code=$?
          echo "$out"
          echo "$out" | grep -q "Node" || { echo "::error::doctor produced no report"; exit 1; }
          echo "$out" | grep -qi "cannot find module" && { echo "::error::doctor crashed on imports"; exit 1; }
          echo "doctor exited $code, which is expected without credentials"
          exit 0

      # The real client entry point is a global install of the packed tarball,
      # not `node brain.mjs`. That path has its own failure modes (bin symlink
      # resolution, the shebang, PATHEXT on Windows) that direct invocation
      # never exercises, and one of them already shipped once: the installed
      # command ran and did nothing, exit 0.
      - name: packed tarball installs globally and the bin works
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "$TARBALL"

          # Locate the bin explicitly rather than trusting PATH: on Windows npm
          # writes brain.cmd into the prefix root, on POSIX a symlink into bin/.
          prefix=$(npm prefix -g)
          if [ -x "$prefix/bin/brain" ]; then bin="$prefix/bin/brain";
          elif [ -f "$prefix/brain.cmd" ]; then bin="$prefix/brain.cmd";
          elif command -v brain >/dev/null 2>&1; then bin="brain";
          else echo "::error::no brain bin found under $prefix"; ls -la "$prefix" "$prefix/bin" 2>/dev/null; exit 1; fi
          echo "bin: $bin"

          out=$("$bin")
          echo "$out"
          echo "$out" | grep -Eq 'setup[[:space:]]+\[manifest\]' || { echo "::error::installed bin ran but printed nothing"; exit 1; }

      # The public guide uses a user-owned prefix. That avoids sudo/EACCES on
      # Mac and Linux and keeps Windows inside the current profile. Exercise
      # that exact shape as well as the traditional global install above.
      - name: packed tarball installs in a user-owned prefix
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/financial-brain-cli"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$TARBALL"
          if [ -x "$prefix/bin/brain" ]; then bin="$prefix/bin/brain";
          elif [ -f "$prefix/brain.cmd" ]; then bin="$prefix/brain.cmd";
          else echo "::error::no user-prefix brain bin found"; exit 1; fi
          out=$("$bin")
          echo "$out"
          echo "$out" | grep -Eq 'setup[[:space:]]+\[manifest\]' || { echo "::error::user-prefix bin did not run"; exit 1; }

      # PowerShell can block npm.ps1/npx.ps1 under its default execution
      # policy. The website therefore uses the .cmd shims explicitly on
      # Windows, and CI must prove that exact beginner path.
      - name: Windows PowerShell user-prefix command works
        if: runner.os == 'Windows'
        env:
          PACKAGE_FILENAME: ${{ needs.package.outputs.artifact_name }}
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'financial-brain-powershell'
          $tarball = Join-Path '.release-package' $env:PACKAGE_FILENAME
          npm.cmd install --global --prefix $prefix --ignore-scripts --no-audit --no-fund $tarball
          $out = & (Join-Path $prefix 'brain.cmd') | Out-String
          $out
          if ($out -notmatch 'setup\s+\[manifest\]') { throw 'PowerShell user-prefix bin did not run' }

      # An install must never carry the author's own client data. package.json
      # uses an allowlist; this fails loudly if a future edit turns it into a
      # denylist that misses something.
      - name: package contains no private data
        shell: bash
        run: |
          set -euo pipefail
          tarball="$TARBALL"
          if command -v cygpath >/dev/null 2>&1; then
            tarball=$(cygpath -u "$tarball")
          fi
          contents=$(tar -tzf "$tarball")
          # NOTE: this is a FILENAME check on the tarball only; it never opens a file.
          # It used to grep for the owner's first name, which put a real identity in a
          # public CI config to catch a real identity. Content-level identity scanning is
          # test/package-privacy.test.mjs, which scans every tracked file and is the
          # authority; this step is only a last-ditch check on what npm would ship.
          private_paths=$(
            {
              printf '%s\n' "$contents" | grep -Ei '(^|/)instances(/|$)|(^|/)eval/baselines(/|$)|(^|/)shadow|readiness|\.brain-(migration|ingest)' || true
              printf '%s\n' "$contents" | grep -Ei '(^|/)eval/golden/' | grep -Ev '(^|/)eval/golden/TEMPLATE\.golden\.json$' || true
            } | sort -u
          )
          if [ -n "$private_paths" ]; then
            printf '%s\n' "$private_paths"
            echo "::error::private evaluation data is in the published package"
            exit 1
          fi
          echo "clean"

  # The preflight exists to catch three Windows traps. A clean runner has none
  # of them, so the job above proves only that it RUNS. This job plants each
  # trap and proves the preflight SAYS SO. A smoke detector that has never
  # smelled smoke is not known to work.
  preflight-traps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: release workflow cannot bypass this CI gate
        run: node scripts/test-release-workflow-contract.mjs

      - name: "trap 1: default execution policy blocks the .ps1 shims"
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope CurrentUser Restricted -Force
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\preflight.ps1 2>&1 | Out-String
          Set-ExecutionPolicy -Scope CurrentUser Undefined -Force
          Write-Host $out
          if ($out -notmatch 'WARN.*brain\.cmd, npm\.cmd and npx\.cmd') { Write-Host "::error::preflight did not warn about the .ps1 shim block"; exit 1 }
          Write-Host "TRAP 1 DETECTED"

      - name: "trap 2: running inside the Claude MSIX sandbox"
        shell: powershell
        run: |
          $env:APPDATA = "C:\Users\x\AppData\Local\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming"
          $out = powershell -NoProfile -File .\tools\preflight.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'STOP.*MSIX sandbox') { Write-Host "::error::preflight did not stop on the MSIX sandbox"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::a STOP must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 2 DETECTED, exit 1 as required"
          # The child correctly exited 1; do not let that leak out as this step's verdict.
          exit 0

      - name: "trap 3: more than one copy of the CLI on PATH"
        shell: powershell
        run: |
          $a = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\cli-a" -Force
          $b = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\cli-b" -Force
          Set-Content "$a\brain.cmd" "@echo off`r`necho fake-a"
          Set-Content "$b\brain.cmd" "@echo off`r`necho fake-b"
          $env:Path = "$a;$b;$env:Path"
          $out = powershell -NoProfile -File .\tools\preflight.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'STOP.*2 copies of the CLI') { Write-Host "::error::preflight did not stop on duplicate CLIs"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::a STOP must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 3 DETECTED, exit 1 as required"
          # The child correctly exited 1; do not let that leak out as this step's verdict.
          exit 0

      - name: "trap 4: an empty earlier Wrangler directory cannot mask a later session"
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'wrangler-layout'
          $env:APPDATA = Join-Path $root 'roaming'
          $env:LOCALAPPDATA = Join-Path $root 'local'
          $env:XDG_CONFIG_HOME = Join-Path $root 'xdg'
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = Join-Path $root 'profile'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'xdg.config\.wrangler\config') | Out-Null
          $session = New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA '.wrangler\config')
          Set-Content (Join-Path $session 'default.toml') 'fixture session marker only'
          $out = powershell -NoProfile -File .\tools\preflight.ps1 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'ok\s+wrangler session found') { Write-Host "::error::an empty earlier directory masked the later Wrangler session"; exit 1 }
          Write-Host "TRAP 4 DETECTED"

      - name: "trap 5: Node 21 is below the supported minimum"
        shell: powershell
        run: |
          $shim = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\node-21" -Force
          Set-Content "$shim\node.cmd" "@echo off`r`necho v21.9.0"
          $env:Path = "$shim;$env:Path"
          $out = powershell -NoProfile -File .\tools\preflight.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'STOP.*node v21\.9\.0 is too old; the installer needs 22 or newer') { Write-Host "::error::preflight accepted unsupported Node 21"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::unsupported Node must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 5 DETECTED, exit 1 as required"
          exit 0

      - name: "control: a clean machine is told plainly that nothing is wrong"
        shell: powershell
        run: |
          $out = powershell -NoProfile -File .\tools\preflight.ps1 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Nothing is wrong here') { Write-Host "::error::clean machine should read as clean"; exit 1 }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::clean machine should exit 0"; exit 1 }
          Write-Host "CONTROL PASSED"
