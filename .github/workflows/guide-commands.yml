# The CLI is tested on Windows. The GUIDE is not, and that is where the last
# three client-facing Windows defects lived: a PATH line pointing at npm's
# default prefix when the CLI is installed somewhere else, an install command
# with no --prefix that leaves the documented path on the old version, and a
# `brain --version` check for a flag that has never existed. Every one was
# found by a client on a call, because a guide is code we ship and nothing ran
# it.
#
# This job runs the commands the update guide actually serves, on the platform
# it serves them for. It asserts on the SERVED bytes rather than on the
# markdown in Drive, because the served page is the one a person is given.

name: guide-commands

on:
  push:
    paths: ['.github/workflows/guide-commands.yml']
  workflow_dispatch:
  schedule:
    # The guide is deployed independently of this repo, so it can drift green
    # to red without a commit here. Check it daily.
    - cron: '17 14 * * *'

permissions:
  contents: read

jobs:
  guide:
    name: the update guide's own ${{ matrix.os }} commands
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel one platform because the other failed. Both are shipped to.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Fetch the guide a client is given. If the page moves or dies, this job
      # fails before it can pass for the wrong reason.
      - name: fetch the served guide
        shell: pwsh
        run: |
          $g = Invoke-WebRequest -UseBasicParsing -Uri "https://fb-install-errors.james-d13.workers.dev/update-guide"
          if ($g.Content.Length -lt 8000) { throw "guide is $($g.Content.Length) bytes, too short to be the real page" }
          $g.Content | Out-File -Encoding utf8 guide.md
          "guide: $($g.Content.Length) bytes"

      # The commands below are asserted to still BE in the guide. If someone
      # rewrites the Windows block, this fails as stale rather than testing a
      # document nobody is reading any more.
      - name: the guide still contains the commands this job tests
        shell: pwsh
        run: |
          $g = Get-Content guide.md -Raw
          $need = @('LOCALAPPDATA\FinancialBrain', 'npm install -g --prefix', 'npm ls -g --prefix', 'Get-Command brain', '$HOME/.npm-global')
          $missing = $need | Where-Object { -not $g.Contains($_) }
          if ($missing) { throw "guide no longer contains: $($missing -join ', ')" }
          "all $($need.Count) tested commands are still in the served guide"

      # A client whose CLI was installed outside npm's default prefix. This is
      # Malini's real layout, measured on her machine 2026-09-03.
      - name: install 0.3.5 the way the guide says, into a non-default prefix
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fb = "$env:LOCALAPPDATA\FinancialBrain"
          New-Item -ItemType Directory -Force -Path $fb | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/guldanjaMAX/brain-installer/releases/download/v0.3.5/brain-installer-0.3.5.tgz" -OutFile "$HOME\brain-installer-0.3.5.tgz"
          npm install -g --prefix "$fb" "$HOME\brain-installer-0.3.5.tgz"
          if (-not (Test-Path "$fb\brain.cmd")) { throw "brain.cmd is NOT at $fb after --prefix install; the guide's install line does not land where it claims" }
          "brain.cmd landed at $fb"

      # The PATH line from Step 1, verbatim in shape. The bug it exists to
      # catch: adding Roaming\npm when the CLI is in Local\FinancialBrain, so
      # `brain` is never found and the client is told to check their PATH.
      - name: the guide's PATH line makes brain resolve to that install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fb = "$env:LOCALAPPDATA\FinancialBrain"
          if (Test-Path "$fb\brain.cmd") { $env:Path = "$fb;$env:Path" } else { $env:Path = "$env:APPDATA\npm;$env:Path" }
          $src = (Get-Command brain -ErrorAction SilentlyContinue).Source
          if (-not $src) { throw "brain does not resolve after the guide's PATH line" }
          if ($src -notlike "$fb*") { throw "brain resolves to $src, not the install at $fb" }
          "brain resolves to $src"

      # Step 2b's proof that the client is not about to re-run the old version.
      - name: the version check prints the version it promises
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fb = "$env:LOCALAPPDATA\FinancialBrain"
          $out = (npm ls -g --prefix "$fb" --depth=0 2>$null | Out-String)
          if ($out -notmatch 'brain-installer@0\.3\.5') { throw "version check did not print brain-installer@0.3.5. It printed:`n$out" }
          "version check prints brain-installer@0.3.5"

      # `brain --version` does not exist and falls through to the help banner.
      # The guide now says so. This asserts the DEFECT still behaves as
      # documented, so that when 0.3.6 adds a real flag, this fails and the
      # guide gets updated with it rather than silently going stale.
      - name: brain --version still has no version flag (documented defect)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:LOCALAPPDATA\FinancialBrain;$env:Path"
          $out = (brain --version 2>&1 | Out-String)
          if ($out -match '^\s*0\.3\.5\s*$') { throw "brain --version now works. Remove the warning from the guide and switch Step 2b back." }
          "confirmed: --version prints the help banner, as the guide warns"
          # `brain --version` exits 1. pwsh steps fail on a trailing non-zero
          # $LASTEXITCODE, so without this the step reports failure having
          # just printed its own PASS line. Seen 2026-09-04, first run.
          exit 0

      # With no credentials, the schema gate must REFUSE and say how to fix it.
      # A crash here is what Malini's session hit as AUTH_REQUIRED with no
      # explanation, and a silent success would be far worse.
      - name: with no credentials, the schema gate refuses and explains
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:LOCALAPPDATA\FinancialBrain;$env:Path"
          $env:BRAIN_NO_WRANGLER_LOGIN = "1"
          # A REAL manifest is required to reach the credential check at all:
          # the manifest is read first, so pointing at a missing file tests the
          # config error, not the credential path. `brain init` writes one with
          # no network and no token, which is exactly what it is for.
          $m = "$env:RUNNER_TEMP\brain.manifest.json"
          brain init $m --name "CI Probe" --slug "ci-probe" --account "00000000000000000000000000000000" | Out-Null
          if (-not (Test-Path $m)) { throw "brain init did not write a manifest at $m" }
          $out = (brain status $m 2>&1 | Out-String)
          $ok = $out -match 'wrangler@4 login' -or $out -match 'no Cloudflare credential'
          if (-not $ok) { throw "no-credential run did not explain itself. It printed:`n$out" }
          "refuses and points at the browser sign-in"
          # Same trailing-exit-code trap: refusing is the expected outcome.
          exit 0

      # ---- macOS. Lindsay and every Mac client take this path, and until
      # 2026-09-04 it had been run only by hand in someone's shell. ----

      - name: mac, install 0.3.5 exactly as the guide's Mac lines say
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -sL -o ~/brain-installer-0.3.5.tgz \
            https://github.com/guldanjaMAX/brain-installer/releases/download/v0.3.5/brain-installer-0.3.5.tgz
          npm install -g --prefix "$HOME/.npm-global" ~/brain-installer-0.3.5.tgz
          test -x "$HOME/.npm-global/bin/brain" || { echo "::error::brain is not at \$HOME/.npm-global/bin after the guide's install line"; exit 1; }
          echo "brain installed at $HOME/.npm-global/bin/brain"

      - name: mac, the version check prints the version it promises
        if: runner.os == 'macOS'
        shell: bash
        run: |
          out=$(npm ls -g --prefix "$HOME/.npm-global" --depth=0 2>/dev/null | grep brain-installer || true)
          echo "$out"
          echo "$out" | grep -q 'brain-installer@0.3.5' \
            || { echo "::error::version check did not print brain-installer@0.3.5"; exit 1; }

      # Step 1's preflight, the one command Claude runs on the call. It must
      # report every line the rest of the guide branches on, and must never
      # print a token value.
      - name: mac, the Step 1 preflight reports what the guide branches on
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          M=$(ls ~/Desktop/financial-brain/brain.manifest.json ~/financial-brain/brain.manifest.json 2>/dev/null | head -1)
          [ -z "$M" ] && M=$(find "$HOME" -maxdepth 4 -name brain.manifest.json \
                -not -path "*/node_modules/*" -not -path "*/templates/*" -not -path "*/.*/*" 2>/dev/null | head -1)
          { echo "manifest:       ${M:-NOT FOUND}"
            if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "token in shell: present"; else echo "token in shell: none"; fi
            echo "installer:      $(npm ls -g --prefix "$HOME/.npm-global" --depth=0 2>/dev/null | sed -n 's/.* \(brain-installer@.*\)/\1/p')"
          } > preflight.txt
          cat preflight.txt
          grep -q '^manifest:' preflight.txt || { echo "::error::preflight printed no manifest line"; exit 1; }
          grep -q '^token in shell:' preflight.txt || { echo "::error::preflight printed no token line"; exit 1; }
          grep -q 'brain-installer@0.3.5' preflight.txt || { echo "::error::preflight did not report the installed version"; exit 1; }

      # The token liveness check the preflight uses to decide whether to trust
      # an existing credential. A dead token MUST NOT read as usable: the
      # installer prefers the env var over the browser session and disables its
      # own renewal while it is set, so trusting a dead one is a hard 403
      # mid-run that blames the client.
      - name: mac, a dead token reads as rejected, not as usable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 12 https://api.cloudflare.com/client/v4/accounts \
                 -H "Authorization: Bearer definitely-not-a-real-token-000")
          echo "dead token -> http $code"
          [ "$code" = "200" ] && { echo "::error::a dead token reported usable"; exit 1; }
          echo "correctly not 200, so the preflight would tell them to sign in instead"

      - name: mac, brain --version still has no version flag (documented defect)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          out=$(brain --version 2>&1 || true)
          echo "$out" | head -2
          echo "$out" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            && { echo "::error::--version now works. Update the guide and this test together."; exit 1; }
          echo "confirmed: --version prints the help banner, as the guide warns"

      - name: mac, with no credentials the schema gate refuses and explains
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          export BRAIN_NO_WRANGLER_LOGIN=1
          M="$RUNNER_TEMP/brain.manifest.json"
          brain init "$M" --name "CI Probe" --slug "ci-probe" --account "00000000000000000000000000000000" >/dev/null
          test -f "$M" || { echo "::error::brain init wrote no manifest"; exit 1; }
          out=$(brain status "$M" 2>&1 || true)
          echo "$out" | head -5
          echo "$out" | grep -qE 'wrangler@4 login|no Cloudflare credential' \
            || { echo "::error::no-credential run did not explain itself"; exit 1; }
          echo "refuses and points at the browser sign-in"
